services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickbite-inventory
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.inventory.rule=(Host(`thuandd.io.vn`) || Host(`traefik`)) && PathPrefix(`/quick-bite-inventory`)"
      - "traefik.http.routers.inventory.entrypoints=web"
      - "traefik.http.services.inventory.loadbalancer.server.port=8083"
      - "traefik.http.routers.inventory.middlewares=inventory-stripprefix@docker"
      - "traefik.http.middlewares.inventory-stripprefix.stripprefix.prefixes=/quick-bite-inventory"
    networks:
      - web
      - internal-net
      - quickbite-net

networks:
  web:
    external: true
  internal-net:
    external: true
  quickbite-net:
    external: true
