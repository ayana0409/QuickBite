spring.application.name=payment-service
server.port=8084

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://<DB_HOST>:<PORT>/defaultdb?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
spring.datasource.username=<DB_USER>
spring.datasource.password=<DB_PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Kafka Common Configuration
spring.kafka.bootstrap-servers=<KAFKA_BOOTSTRAP_SERVERS>
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-512
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="<KAFKA_USER>" password="<KAFKA_PASSWORD>";
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.truststore.location=src/main/resources/ca.pem

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topics.listen=order-events

# HikariCP DB Resilience
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000

# Kafka Producer Configuration
spring.kafka.template.default-topic=fulfillment-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.topics.publish=fulfillment-events

# Kafka Auto-Retry & Resilience
spring.kafka.admin.fail-fast=false
spring.kafka.producer.retries=10
spring.kafka.producer.properties.retry.backoff.ms=3000
spring.kafka.producer.properties.request.timeout.ms=30000

# Frontend Sandbox URL Configuration
app.payment.frontend-sandbox-url=${APP_PAYMENT_FRONTEND_SANDBOX_URL:https://fe-demo.com/sandbox-payment}

