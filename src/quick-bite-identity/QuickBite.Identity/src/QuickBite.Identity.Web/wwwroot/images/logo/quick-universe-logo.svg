    <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#cosmicGradLogo)" stroke-width="4.5" transform="rotate(30 50 50)" opacity="0.9" />
    <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#cosmicGradLogo)" stroke-width="4.5" transform="rotate(90 50 50)" opacity="0.7" />
    <circle cx="86" cy="30" r="5" fill="#38bdf8" />
    <circle cx="14" cy="70" r="4.5" fill="#f43f5e" />
    <circle cx="50" cy="8" r="4.5" fill="#a855f7" />
    <circle cx="50" cy="50" r="14" fill="url(#centerGlowLogo)" />
    <circle cx="50" cy="50" r="8" fill="#ffffff" />
  </g>

  <!-- Typography Text -->
  <text x="38" y="23" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="800" fill="url(#textGrad)" letter-spacing="0.3">QUICK UNIVERSE</text>
