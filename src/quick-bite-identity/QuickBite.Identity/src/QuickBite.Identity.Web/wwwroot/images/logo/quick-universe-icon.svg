<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Orbit Rings -->
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#cosmicGrad)" stroke-width="3.5" transform="rotate(-30 50 50)" stroke-dasharray="8 3" opacity="0.9" />
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#cosmicGrad)" stroke-width="3.5" transform="rotate(30 50 50)" opacity="0.9" />
  <ellipse cx="50" cy="50" rx="42" ry="16" fill="none" stroke="url(#cosmicGrad)" stroke-width="3.5" transform="rotate(90 50 50)" opacity="0.7" />
  
  <!-- Orbit Electrons / Particles -->
  <circle cx="86" cy="30" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="14" cy="70" r="4" fill="#f43f5e" filter="url(#glow)" />
  <circle cx="50" cy="8" r="4" fill="#a855f7" filter="url(#glow)" />
  
  <!-- Central Glowing Star / Nucleus -->
  <circle cx="50" cy="50" r="14" fill="url(#centerGlow)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="8" fill="#ffffff" />
</svg>
